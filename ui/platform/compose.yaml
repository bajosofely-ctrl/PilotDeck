services:
  platform:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      PLATFORM_HOST: 0.0.0.0
      PLATFORM_DATABASE: /data/platform.sqlite
      PLATFORM_PORT: 3100
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - platform-data:/data
    stop_grace_period: 150s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  platform-data:
