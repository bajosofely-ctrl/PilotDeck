user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    keepalive_timeout 30s;
    server {
        listen 8443 ssl;
        server_name 124.222.153.173;
        ssl_certificate /etc/letsencrypt/live/qyxc-ip/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/qyxc-ip/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:4m;
        client_max_body_size 4m;
        location / {
            proxy_pass http://127.0.0.1:3100;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            # Replace client-supplied forwarding headers at the public boundary.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
