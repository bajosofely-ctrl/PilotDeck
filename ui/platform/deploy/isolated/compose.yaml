name: pilotdeck-platform
services:
  platform:
    image: ${PLATFORM_IMAGE:?Set PLATFORM_IMAGE}
    restart: unless-stopped
    init: true
    env_file:
      - /opt/pilotdeck-platform/secrets/platform.env
    ports:
      - "8443:8443"
    volumes:
      - /opt/pilotdeck-platform/data:/data
      - /opt/pilotdeck-platform/backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 0.75
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    stop_grace_period: 150s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  proxy:
    image: ${PROXY_IMAGE:?Set PROXY_IMAGE}
    restart: unless-stopped
    init: true
    network_mode: service:platform
    depends_on:
      platform:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/etc/pilotdeck/proxy-entrypoint.sh"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy-entrypoint.sh:/etc/pilotdeck/proxy-entrypoint.sh:ro
      - /etc/letsencrypt/live/qyxc-ip:/etc/letsencrypt/live/qyxc-ip:ro
      - /etc/letsencrypt/archive/qyxc-ip:/etc/letsencrypt/archive/qyxc-ip:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, KILL]
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 32
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1:8443/health"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
